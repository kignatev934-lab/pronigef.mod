name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download Gradle Wrapper
        run: |
          curl -L -o gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradlew
          curl -L -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradlew.bat
          mkdir -p gradle/wrapper
          mv gradle-wrapper.jar gradle/wrapper/
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pronegif-jar
          path: build/libs/*.jar
